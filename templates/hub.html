<!DOCTYPE html>
<html lang="zh-CN">
<head>

            <span class="hc-icon">📚</span>
            <span class="hc-name">刷题</span>
            <span class="hc-desc">题库练习</span>
        </a>
        <a class="hub-card" href="/yuketang">

            <span class="hc-name">刷课</span>
            <span class="hc-desc">雨课堂课程</span>
        </a>
    </main>

    <footer class="hub-foot">
        <button class="link-btn" onclick="openFormatGuide()">📋 导入格式说明</button>
        <span class="foot-sep">·</span>
        <button class="link-btn danger" onclick="shutdownServer()">🚪 关闭程序</button>
    </footer>
